<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SQL Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { purple: '#48387D', pink: '#ED288E' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- VannaComponentScript -->
    <style>
        .chat-container {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-container vanna-chat {
            flex: 1;
            min-height: 0;
            width: 100% !important;
            max-width: 100% !important;
            overflow: hidden;
        }
        
    </style>
</head>
<body class="m-0 p-0 bg-gradient-to-r from-brand-purple to-brand-pink font-sans">
    <div class="flex flex-col h-screen w-screen overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-brand-purple to-brand-pink text-white px-6 py-6 shrink-0">
            <h1 class="text-2xl font-semibold mt-1">AI SQL Writer</h1>
            <p class="text-xs mt-1 opacity-90">Query your database using natural language powered by AI.</p>
        </header>

        <!-- Main Content -->
        <main class="flex flex-1 gap-4 p-4 min-h-0">
            
            <!-- Left Sidebar -->
            <aside class="w-[260px] min-w-[260px] max-w-[260px] bg-white rounded-3xl shadow-xl flex flex-col overflow-hidden shrink-0">
                
                <!-- Chat History Section -->
                <section class="p-4 border-b border-gray-200 flex-1 min-h-0 flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-brand-purple">Chat History</h3>
                        <button onclick="createNewThread()" class="px-3 py-1.5 text-xs font-medium text-white bg-gradient-to-r from-brand-purple to-brand-pink rounded-lg shadow hover:shadow-md transition-all hover:-translate-y-0.5">
                            + New
                        </button>
                    </div>
                    <div id="threadsList" class="flex-1 overflow-y-auto">
                        <div class="text-gray-500 text-xs text-center py-3">No chat history</div>
                    </div>
                </section>
                
                <!-- Saved SQL Section -->
                <section class="p-4 flex-1 min-h-0 flex flex-col">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-brand-purple mb-3">Saved SQL</h3>
                    <div id="favoritesList" class="flex-1 overflow-y-auto">
                        <div class="text-gray-500 text-xs text-center py-3">No saved SQL</div>
                    </div>
                </section>
            </aside>

            <!-- Chat Area -->
            <section class="flex-1 flex flex-col bg-white rounded-3xl shadow-xl overflow-hidden min-w-0">
                <div class="chat-container flex-1 bg-gray-200 rounded-b-3xl">
                    <vanna-chat
                        id="vchat"
                        title="Smart Cohort Builder"
                        api-base=""
                        sse-endpoint="/api/vanna/v2/chat_sse"
                        ws-endpoint="/api/vanna/v2/chat_websocket"
                        poll-endpoint="/api/vanna/v2/chat_poll">
                    </vanna-chat>
                </div>
            </section>
        </main>
    </div>

    <script>
        let threads = [];
        let favorites = [];
        let currentThreadId = null;

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers,
                },
            });
            if (!response.ok) {
                throw new Error(`API error: ${response.statusText}`);
            }
            return response.json();
        }

        async function loadThreads() {
            try {
                const data = await apiCall('/api/chat/threads');
                threads = data.threads || [];
                renderThreads();
            } catch (error) {
                console.error('Error loading threads:', error);
            }
        }

        function renderThreads() {
            const container = document.getElementById('threadsList');
            if (threads.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-xs text-center py-3">No chat history</div>';
                return;
            }
            container.innerHTML = threads.map(thread => {
                const preview = thread.preview || '';
                const isActive = thread.id === currentThreadId;
                return `
                    <div class="p-2 px-3 mb-1 rounded-lg cursor-pointer transition-colors border ${isActive ? 'bg-pink-50 border-pink-300' : 'border-transparent hover:bg-purple-50'}" onclick="selectThread('${thread.id}')">
                        <div class="font-semibold text-sm text-brand-purple truncate">${escapeHtml(thread.title)}</div>
                        <div class="text-xs text-gray-500 truncate">${escapeHtml(preview)}</div>
                    </div>
                `;
            }).join('');
        }

        function formatThreadTitle() {
            const now = new Date();
            const date = now.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric' 
            });
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            return `${date} ${time}`;
        }

        async function createNewThread() {
            const threadId = uid();
            const title = formatThreadTitle();
            try {
                await apiCall('/api/chat/threads', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: threadId,
                        title: title,
                    }),
                });
                currentThreadId = threadId;
                await loadThreads();
                selectThread(threadId);
            } catch (error) {
                console.error('Error creating thread:', error);
                alert('Failed to create thread');
            }
        }

        async function selectThread(threadId) {
            currentThreadId = threadId;
            renderThreads();
            // Note: vanna-chat manages its own conversationId internally
            // For now, we'll just track which thread is selected for display purposes
            // Future enhancement: could reload page or reset chat component with thread messages
        }

        async function loadFavorites() {
            try {
                const data = await apiCall('/api/chat/favorites');
                favorites = data.favorites || [];
                renderFavorites();
            } catch (error) {
                console.error('Error loading favorites:', error);
            }
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesList');
            if (favorites.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-xs text-center py-3">No saved SQL</div>';
                return;
            }
            container.innerHTML = favorites.filter(fav => fav.type === 'sql').map(fav => {
                const preview = fav.payload.length > 50 
                    ? fav.payload.substring(0, 50) + '...' 
                    : fav.payload;
                return `
                    <div class="p-2 px-3 mb-1 rounded-lg cursor-pointer transition-colors border border-transparent hover:bg-purple-50">
                        <div class="font-semibold text-sm text-brand-purple flex justify-between items-center">
                            <span class="truncate">${escapeHtml(fav.title)}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-gradient-to-r from-brand-purple to-brand-pink text-white">SQL</span>
                        </div>
                        <div class="favorite-preview">${escapeHtml(preview)}</div>
                        <div style="display: flex; gap: 4px; margin-top: 4px;">
                         <button class="px-2 py-1 text-xs rounded border border-gray-200 bg-white text-gray-600 hover:bg-green-50 hover:text-green-600 hover:border-green-300 transition-colors" onclick="useFavorite('${fav.id}')">Use</button>
                    <button class="px-2 py-1 text-xs rounded border border-gray-200 bg-white text-gray-600 hover:bg-red-50 hover:text-red-600 hover:border-red-300 transition-colors" onclick="deleteFavorite('${fav.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function useFavorite(favoriteId) {
            const fav = favorites.find(f => f.id === favoriteId);
            if (!fav) return;
            const chat = document.getElementById('vchat');
            if (chat) {
                if (chat.setInput) {
                    chat.setInput(fav.payload);
                } else {
                    const input = chat.shadowRoot?.querySelector('textarea, input[type="text"]') 
                        || chat.querySelector('textarea, input[type="text"]');
                    if (input) {
                        input.value = fav.payload;
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            }
        }

        async function deleteFavorite(favoriteId) {
            if (!confirm('Delete this saved SQL?')) return;
            try {
                await apiCall(`/api/chat/favorites/${favoriteId}`, {
                    method: 'DELETE',
                });
                await loadFavorites();
            } catch (error) {
                console.error('Error deleting favorite:', error);
                alert('Failed to delete favorite');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadThreads();
            loadFavorites();
            
            const chat = document.getElementById('vchat');
            if (chat) {
                try {
                    chat.showProgress = false;
                    chat.allowMinimize = false; //  disable minimize
                    chat.startingState = 'normal';
                    chat.windowState = 'normal';
                    // if (chat.maximizeWindow) {
                    //     chat.maximizeWindow();
                    // }
                    
                    // Monitor for state changes
                    const observer = new MutationObserver(() => {
                        adjustChatPosition();
                    });
                    
                    // Observe class changes on the chat element
                    observer.observe(chat, {
                        attributes: true,
                        attributeFilter: ['class'],
                        subtree: false
                    });
                    
                    // Also observe shadow DOM if accessible
                    if (chat.shadowRoot) {
                        observer.observe(chat.shadowRoot, {
                            childList: true,
                            subtree: true
                        });
                    }
                    
                    // Initial adjustment
                    setTimeout(adjustChatPosition, 100);
                    setInterval(adjustChatPosition, 500);
                } catch (e) {
                    console.warn('Could not configure vanna-chat:', e);
                }
            }

            const chatElement = document.getElementById('vchat');
            if (chatElement) {
                // Create or get current thread when first message is sent
                let messageCount = 0;
                
                chatElement.addEventListener('message-sent', async (event) => {
                    const message = event.detail?.message;
                    if (message) {
                        messageCount++;
                        // Create thread on first message if none exists
                        if (!currentThreadId) {
                            await createNewThread();
                        }
                        if (currentThreadId) {
                            try {
                                await apiCall(`/api/chat/threads/${currentThreadId}/messages`, {
                                    method: 'POST',
                                    body: JSON.stringify({
                                        id: uid(),
                                        role: 'user',
                                        content: message,
                                    }),
                                });
                                // Update thread preview
                                await loadThreads();
                            } catch (error) {
                                console.error('Error saving user message:', error);
                            }
                        }
                    }
                });

                // Listen for chunk-received to save assistant messages
                chatElement.addEventListener('chunk-received', async (event) => {
                    // This fires for each chunk, we might want to debounce or save on completion
                });
            }

            window.addEventListener('favorites-updated', () => {
                loadFavorites();
            });
        });

        window.createNewThread = createNewThread;
        window.selectThread = selectThread;
        window.deleteFavorite = deleteFavorite;
        window.useFavorite = useFavorite;
    </script>
</body>
</html>
